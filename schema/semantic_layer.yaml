# THE CONTRACT. Every other module reads this file.
# Now written against the REAL schema (schema/DATA_DICTIONARY.md): 3 tables,
# bank -> account -> transaction. Indian bank narrations, INR, single company.

anchor:
  # What "today" means when resolving "this month", "last quarter", etc.
  #
  #   data        the latest transaction in the dataset  (default)
  #   wall_clock  the real current date
  #
  # Override per-process with FINANCE_ANCHOR_MODE=data|wall_clock.
  #
  # `data` is the right default for a historical export: this dataset ends
  # 2026-06-30, so wall-clock "this month" matches ZERO rows and the assistant
  # answers "no transactions found" for every relative-date question -- a
  # silent, confident wrong answer. Use `wall_clock` only when the data is
  # live and current; the app warns when the two disagree.
  mode: data
  source: transaction.transaction_date

# The one queryable view. Built at load time in scripts/load_data.py so the
# joins and the parsed counterparty are already materialised.
base_view: txn_enriched

datasets:
  transactions:
    view: txn_enriched
    date_column: transaction_date
    amount_column: transaction_amount
    grain: one row per credit or debit
  payouts:
    # There is NO vendor_payouts table. "Vendor payouts" = money going out.
    view: txn_enriched
    date_column: transaction_date
    amount_column: transaction_amount
    fixed_filter: "transaction_type = 'debit'"
    grain: one row per outgoing transaction
  receipts:
    view: txn_enriched
    date_column: transaction_date
    amount_column: transaction_amount
    fixed_filter: "transaction_type = 'credit'"
    grain: one row per incoming transaction

metrics:
  sum_amount: {sql: "SUM({amount})", label: total amount}
  count:      {sql: "COUNT(*)",      label: number of transactions}
  avg_amount: {sql: "AVG({amount})", label: average amount}
  max_amount: {sql: "MAX({amount})", label: largest amount}
  min_amount: {sql: "MIN({amount})", label: smallest amount}

dimensions:
  counterparty:     {column: counterparty}        # parsed from description
  channel:          {column: channel}             # UPI / IMPS / NEFT / FT / ...
  transaction_type: {column: transaction_type}    # credit | debit
  bank_name:        {column: bank_name}
  bank_code:        {column: bank_code}
  account_id:       {column: account_id}
  entity_id:        {column: entity_id}
  program_id:       {column: program_id}
  category:         {column: category}          # TAX / BANK_CHARGES / TRANSFER / ...
  month:            {expr: "date_trunc('month', {date})"}
  quarter:          {expr: "date_trunc('quarter', {date})"}

# --- DECISION, not a fact. See DECISIONS.md #1 -------------------------------
# The schema has NO reconciliation status column, but the problem statement
# asks for one. We define it as "does this transaction carry a reference we
# could match against an external record". Change the expression here and the
# whole system follows; it is deliberately in one place.
derived:
  reconciliation_state:
    sql: |
      CASE WHEN transaction_reference_id IS NOT NULL
                 AND trim(transaction_reference_id) <> '' THEN 'reconciled'
           ELSE 'unreconciled' END

# Never returned raw in an answer or an evidence row. The data dictionary marks
# both as sensitive; utr_number arrives already encrypted and is not searchable.
sensitive_columns:
  account_number: {mask: last4}
  utr_number:     {mask: redact}

# "Ref no" is ambiguous -- two columns claim it. See DECISIONS.md #2.
# A bare "reference number" question hits transaction_reference_id (plaintext,
# searchable). utr_number only when the user says "UTR" explicitly.
reference_columns:
  default: transaction_reference_id
  explicit_utr: utr_number

# Money you cannot simply choose to spend less of this month. Used when someone
# asks where they could save: ranking EMI, rent, insurance and tax alongside
# groceries is misleading, and INVESTMENT is saving, not spending at all.
committed_categories: [TAX, EMI_LOAN, RENT, INSURANCE, INVESTMENT,
                       INTEREST, BANK_CHARGES, SALARY]

spend_categories: [TAX, BANK_CHARGES, INTEREST, EMI_LOAN, SALARY, UTILITIES,
                   INSURANCE, INVESTMENT, CASH, CHEQUE, RENT,
                   # derived from the MERCHANT rather than the narration keywords
                   FOOD, GROCERIES, FUEL, HEALTHCARE, JEWELLERY, APPAREL,
                   ELECTRONICS, HOME,
                   TRANSFER, UNCATEGORISED]

synonyms:
  spend:       {dataset: payouts, metric: sum_amount}
  spent:       {dataset: payouts, metric: sum_amount}
  paid:        {dataset: payouts, metric: sum_amount}
  payouts:     {dataset: payouts}
  received:    {dataset: receipts, metric: sum_amount}
  credits:     {dataset: receipts}
  debits:      {dataset: payouts}
  tax:         {dimension: category, value: TAX}
  taxes:       {dimension: category, value: TAX}
  gst:         {dimension: category, value: TAX}
  tds:         {dimension: category, value: TAX}
  fees:        {dimension: category, value: BANK_CHARGES}
  charges:     {dimension: category, value: BANK_CHARGES}
  vendor:      {dimension: counterparty}
  merchant:    {dimension: counterparty}
  supplier:    {dimension: counterparty}
