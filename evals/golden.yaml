- id: dt_absolute_range
  tags: [dates]
  question: What did I spend between 2026-01-01 and 2026-03-31?
  expect_spec: {dataset: payouts, metric: sum_amount,
                date_range: {kind: absolute, start: '2026-01-01', end: '2026-03-31'}}

