# ---------- multi-turn ----------
- id: mt_compare_month
  tags: [multiturn]
  after: grp_top_vendor_month
  question: How does that compare to the month before?
  expect_spec: {dataset: payouts, group_by: [counterparty]}
  expect_comparison: true

- id: mt_tax_previous
  tags: [multiturn]
  after: agg_tax_3_months
  question: And the 3 months before that?
  expect_spec: {dataset: payouts, filters: {category: TAX}}

- id: mt_narrow_to_tax
  tags: [multiturn]
  after: grp_by_category
  question: Just show me tax
  expect_spec: {dataset: payouts, filters: {category: TAX}}

- id: mt_regroup
  tags: [multiturn]
  after: grp_top_vendor_month
  question: Break that down by category instead
  expect_spec: {dataset: payouts, group_by: [category]}

- id: mt_vendor_last_month
  tags: [multiturn]
  after: flt_vendor_zomato
  question: What about just last month?
  expect_spec: {dataset: payouts, filters: {counterparty: ZOMATO HYPERPURE},
                date_range: {kind: relative, unit: month, offset: -1}}

# ---------- refusals (a correct refusal is a correct answer) ----------
- id: ref_reconciliation
  tags: [refusal]
  question: Which transactions are still unreconciled?
  expect_refusal: true

- id: ref_credit_score
  tags: [refusal]
  question: What is my credit score?
  expect_refusal: true

- id: ref_forecast
  tags: [refusal]
  question: How much will I spend next month?
  expect_refusal: true

- id: ref_budget
  tags: [refusal]
  question: Am I over budget this month?
  expect_refusal: true

- id: ref_pnl
  tags: [refusal]
  question: Show me my profit and loss statement
  expect_refusal: true

- id: ref_net_worth
  tags: [refusal]
  question: What is my net worth?
  expect_refusal: true

- id: ref_tax_owed
  tags: [refusal]
  question: How much tax do I still owe this year?
  expect_refusal: true

- id: ref_invoices
  tags: [refusal]
  question: Show me all invoices from Acme Corp
  expect_refusal: true

# ---------- ambiguous (clarify, never guess) ----------
- id: amb_unknown_vendor
  tags: [ambiguous]
  question: How much did I pay Northwind Traders?
  expect_refusal: true          # no such counterparty in the data

- id: amb_unknown_category
  tags: [ambiguous]
  question: How much did I spend on groceries?
  expect_refusal: true          # not a category we derive

- id: amb_bare_word
  tags: [ambiguous]
  question: spend
  expect_spec: {dataset: payouts, metric: sum_amount}   # a total is the honest reading
