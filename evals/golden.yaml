# Golden set — the accuracy number for the deck, and the regression net.
#
# HOW TO ADD A QUESTION (10 per person, ~50 total):
#   1. Write the question the way a real user would say it.
#   2. Write `expect_spec` with ONLY the fields that matter. It is a subset
#      match, so you do not have to specify everything.
#   3. Eyeball it. That is the human verification step -- you are checking the
#      INTERPRETATION, not arithmetic. Expected values are derived by running
#      your verified spec (`make eval-freeze`), so nobody hand-computes sums.
#   4. For an unanswerable question use `expect_refusal: true`. A correct
#      refusal scores as a correct answer -- that is the point.
#
# tags drive the per-category accuracy breakdown in the report.

# ---------- simple aggregates ----------
- id: agg_spend_last_month
  tags: [aggregate, dates]
  question: How much did I spend last month?
  expect_spec: {dataset: payouts, metric: sum_amount, date_range: {kind: relative, unit: month, offset: -1}}

- id: agg_spend_this_month
  tags: [aggregate, dates]
  question: How much have I spent this month?
  expect_spec: {dataset: payouts, metric: sum_amount, date_range: {kind: relative, unit: month, offset: 0}}

- id: agg_received_last_month
  tags: [aggregate]
  question: How much money came in last month?
  expect_spec: {dataset: receipts, metric: sum_amount, date_range: {kind: relative, unit: month, offset: -1}}

- id: agg_count_last_month
  tags: [aggregate, metric]
  question: How many payments did I make last month?
  expect_spec: {dataset: payouts, metric: count, date_range: {kind: relative, unit: month, offset: -1}}

- id: agg_tax_3_months
  tags: [aggregate, category, dates]
  question: Total tax I paid in the last 3 months
  expect_spec: {dataset: payouts, metric: sum_amount, filters: {category: TAX},
                date_range: {kind: relative, unit: month, offset: 0, periods: 3}}

- id: agg_charges_quarter
  tags: [aggregate, category]
  question: How much did I pay in bank charges this quarter?
  expect_spec: {dataset: payouts, metric: sum_amount, filters: {category: BANK_CHARGES},
                date_range: {kind: relative, unit: quarter, offset: 0}}

- id: agg_largest_payment
  tags: [aggregate, metric]
  question: What was my largest payment last month?
  expect_spec: {dataset: payouts, metric: max_amount, date_range: {kind: relative, unit: month, offset: -1}}

- id: agg_all_time
  tags: [aggregate]
  question: What is my total spend overall?
  expect_spec: {dataset: payouts, metric: sum_amount, date_range: {kind: all_time}}

