# THE model configuration. Committed on purpose -- this file is the reason
# five people get identical behaviour.
#
# Rule: .env carries ONLY the endpoint (which machine). Everything about how
# the model behaves lives here, in git, identical for everyone.

# ollama  -> use `derived` (params baked into a Modelfile on the host)
# gemini   -> Google AI Studio's OpenAI-compatible endpoint; uses `base`
#             https://generativelanguage.googleapis.com/v1beta/openai
# hosted   -> any other OpenAI-compatible API; uses `base`
#
# NOTE ON THE <=20B CAP: Google does not publish parameter counts for Gemini,
# so that claim cannot be demonstrated. Gemma is served from the SAME endpoint
# with the SAME key and does publish its sizes -- set every role's `base` to
# gemma-3-4b-it (or -12b-it) and the cap becomes provable with no other change.
#
# Only OPEN-WEIGHTS models, whichever provider. The <=20B cap has to be
# demonstrable: nobody publishes parameter counts for Gemini/GPT/Claude, so a
# judge asking "is this under 20B?" gets no answer. Gemma, Llama and Qwen all
# state their sizes on the model card.
provider: gemini

host:
  owner: "TODO: name"        # who runs the server
  ram_gb: 16                 # drives the model sizes below
  family: qwen3              # one family throughout -- prompt behaviour differs
                             # enough between families that re-tuning the planner
                             # few-shots mid-hackathon would cost hours
  note: "Single shared inference server. Do NOT run your own Ollama."

# Candidates for the model-efficiency table (BACKLOG Q4). Not used at runtime;
# `make eval-compare` runs the golden set across them.
comparison:
  - qwen3:1.7b
  - qwen3:4b
  - qwen3:8b

# Hosted fallbacks -- open weights, published sizes, nothing to download.
# Switch by setting `provider: hosted` above plus LLM_BASE_URL/LLM_API_KEY,
# and pointing the roles' `base` at one of these.
hosted_options:
  groq:                      # https://api.groq.com/openai/v1
    - llama-3.1-8b-instant   # 8B
    - gemma2-9b-it           # 9B
  google_ai_studio:          # https://generativelanguage.googleapis.com/v1beta/openai
    - gemma-3-4b-it          # 4B
    - gemma-3-12b-it         # 12B

# Sampling params are baked into derived models on the host (see
# scripts/build_models.sh), so they cannot drift even if a client forgets
# to send them.
roles:
  router:
    base: gemini-3.5-flash-lite
    ollama_base: qwen3:0.6b
    derived: fin-router:v1
    temperature: 0
    top_p: 1.0
    seed: 42
    num_ctx: 4096            # Ollama silently truncates past num_ctx. Set it
                             # explicitly or long prompts behave differently
                             # on different hosts.
  planner:
    base: gemini-3.5-flash-lite   # pinned, not -latest: an alias shifts
    ollama_base: qwen3:4b         # under you and eval numbers stop matching
    derived: fin-planner:v1
    temperature: 0
    top_p: 1.0
    seed: 42
    num_ctx: 8192            # the QuerySpec schema + few-shots are long
  narrator:
    base: gemini-3.5-flash-lite
    ollama_base: qwen3:4b
    derived: fin-narrator:v1
    temperature: 0.2         # slight variation reads better in prose;
    top_p: 0.9               # the numeric guard makes this safe
    seed: 42
    num_ctx: 4096
  escalate:
    base: gemini-3.6-flash   # a genuinely larger model, so escalating means something
    ollama_base: qwen3:8b    # MUST differ from the planner -- escalating to the
                             # same model does nothing, and the escalation rate
                             # is the evidence behind the efficiency claim.
                             # 16GB host: 4B + 8B co-resident is ~7.5GB.
    derived: fin-escalate:v1
    temperature: 0
    top_p: 1.0
    seed: 42
    num_ctx: 8192

# Self-consistency sampling deliberately overrides temperature at call time.
# This is the ONE place non-zero sampling is intentional.
confidence:
  # 3 samples triples the call count, and free tiers throttle well before an
  # eval run finishes. Keep 1 while iterating; raise to 3 for the final number.
  samples: 1
  temperature: 0.7
