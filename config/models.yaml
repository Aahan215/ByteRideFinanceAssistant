# THE model configuration. Committed on purpose -- this file is the reason
# five people get identical behaviour.
#
# Rule: .env carries ONLY the endpoint (which machine). Everything about how
# the model behaves lives here, in git, identical for everyone.

host:
  owner: "TODO: name"        # who runs the server
  ram_gb: 16                 # drives the model sizes below
  family: qwen2.5            # one family throughout -- prompt behaviour differs
                             # enough between families that re-tuning the planner
                             # few-shots mid-hackathon would cost hours
  note: "Single shared inference server. Do NOT run your own Ollama."

# Candidates for the model-efficiency table (BACKLOG Q4). Not used at runtime;
# `make eval-compare` runs the golden set across them.
comparison:
  - qwen2.5:3b
  - llama3.2:3b
  - qwen2.5:7b

# Sampling params are baked into derived models on the host (see
# scripts/build_models.sh), so they cannot drift even if a client forgets
# to send them.
roles:
  router:
    base: qwen2.5:0.5b
    derived: fin-router:v1
    temperature: 0
    top_p: 1.0
    seed: 42
    num_ctx: 4096            # Ollama silently truncates past num_ctx. Set it
                             # explicitly or long prompts behave differently
                             # on different hosts.
  planner:
    base: qwen2.5:3b
    derived: fin-planner:v1
    temperature: 0
    top_p: 1.0
    seed: 42
    num_ctx: 8192            # the QuerySpec schema + few-shots are long
  narrator:
    base: qwen2.5:3b
    derived: fin-narrator:v1
    temperature: 0.2         # slight variation reads better in prose;
    top_p: 0.9               # the numeric guard makes this safe
    seed: 42
    num_ctx: 4096
  escalate:
    base: qwen2.5:7b         # 16GB host: 3B + 7B co-resident (~6.5GB).
                             # gpt-oss:20b needs ~24GB and would thrash.
    derived: fin-escalate:v1
    temperature: 0
    top_p: 1.0
    seed: 42
    num_ctx: 8192

# Self-consistency sampling deliberately overrides temperature at call time.
# This is the ONE place non-zero sampling is intentional.
confidence:
  samples: 3
  temperature: 0.7
